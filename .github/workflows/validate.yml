name: Execute notebooks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebooks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install dependencies
        run: |
          if [ "${{ matrix.python-version }}" = "3.8" ]; then
            python -m pip install -r requirements-py38.txt
            python -m pip install -r requirements-xgboost-py38.txt
          else
            python -m pip install -r requirements.txt
            python -m pip install -r requirements-xgboost.txt
          fi
      - name: Validate full notebooks and independent recipes
        env:
          MPLBACKEND: Agg
        run: python scripts/run_notebooks.py --check-recipes --html --require-optional
